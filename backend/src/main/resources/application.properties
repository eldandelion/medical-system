spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/medical_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
server.error.include-message=always
server.error.include-stacktrace=always
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization for Concurrent Intake (Increased from default 10 to 60)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:60}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:20}
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Embedded Tomcat Thread Pool Optimization for High Concurrency (Increased from default 200 to 400)
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

storage.s3.endpoint-internal=${STORAGE_S3_ENDPOINT_INTERNAL:http://localhost:9000}
storage.s3.endpoint-external=${STORAGE_S3_ENDPOINT_EXTERNAL:http://localhost:9000}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY}
storage.s3.bucket=${STORAGE_S3_BUCKET:medical-attachments}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}

# ==============================================================================
# Spring Boot Mail Configuration (Defaulting to QQ Mail SMTP over SSL Port 465)
# When running locally without real SMTP, leave SPRING_MAIL_HOST empty to use LoggingEmailSender.
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# QQ Mail SSL Security Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Critical Network Timeout Safeguards (in milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# Connection pool: default 10 starves under a few hundred concurrent respondents
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:30}

# JWT signing key: NO default. If JWT_SECRET is unset/empty, too short (<48 bytes), or equal to
# the previously committed (now-public) value, startup fails with an actionable error from JwtService.
jwt.secret=${JWT_SECRET:}

# ------------------------------------------------------------------------------
# SMS OTP provider configuration (Aliyun DYSMS).
# MockSmsSender is the DEFAULT: with aliyun.sms.enabled false/absent, OTPs are logged
# and returned as devCode in API responses (development only).
# AliyunSmsSender activates only when enabled=true AND all required keys are set;
# a partial configuration fails fast at startup (SmsConfigValidator).
# No credentials are committed here — supply them via environment variables only.
# ------------------------------------------------------------------------------
aliyun.sms.enabled=${ALIYUN_SMS_ENABLED:false}
aliyun.sms.access-key-id=${ALIYUN_SMS_ACCESS_KEY_ID:}
aliyun.sms.access-key-secret=${ALIYUN_SMS_ACCESS_KEY_SECRET:}
aliyun.sms.sign-name=${ALIYUN_SMS_SIGN_NAME:}
aliyun.sms.template-code=${ALIYUN_SMS_TEMPLATE_CODE:}

# Per-IP rate limiting / daily quota on POST /api/auth/send-code (billing-abuse guard).
# hourly-limit: max send-code requests per sliding 1-hour window per IP (default 5).
# daily-limit: max send-code requests per IP per calendar day (configurable billing cap).
sms.rate-limit.enabled=${SMS_RATE_LIMIT_ENABLED:true}
sms.rate-limit.hourly-limit=${SMS_RATE_LIMIT_HOURLY_LIMIT:5}
sms.rate-limit.daily-limit=${SMS_RATE_LIMIT_DAILY_LIMIT:20}
