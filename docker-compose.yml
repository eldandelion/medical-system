services:
  frontend:
    image: ${IMAGE_REGISTRY:-crpi-94whiojrmibrfhj8-vpc.cn-shanghai.personal.cr.aliyuncs.com/medical-system}/medical-system-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-system-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  mobile:
    image: ${IMAGE_REGISTRY:-crpi-94whiojrmibrfhj8-vpc.cn-shanghai.personal.cr.aliyuncs.com/medical-system}/medical-system-mobile:${IMAGE_TAG:-latest}
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: medical-system-mobile
    ports:
      - "3005:80"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  backend:
    image: ${IMAGE_REGISTRY:-crpi-94whiojrmibrfhj8-vpc.cn-shanghai.personal.cr.aliyuncs.com/medical-system}/medical-system-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-system-backend
    expose:
      - "8080"
    restart: unless-stopped
    depends_on:
      - db
      - minio
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/me | grep -qE '^(200|401|403)$'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/medical_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - STORAGE_S3_ENDPOINT_INTERNAL=http://minio:9000
      - STORAGE_S3_ENDPOINT_EXTERNAL=http://${EXTERNAL_IP:-www.xiangxiaoya.com}
      - STORAGE_S3_ACCESS_KEY=minioadmin
      - STORAGE_S3_SECRET_KEY=miniopassword
      - STORAGE_S3_BUCKET=medical-attachments
      - STORAGE_S3_REGION=us-east-1
      - JWT_SECRET=${JWT_SECRET:-}
      - ALIYUN_SMS_ENABLED=${ALIYUN_SMS_ENABLED:-false}
      - ALIYUN_SMS_PROVIDER=${ALIYUN_SMS_PROVIDER:-${ALIBABA_SMS_PROVIDER:-dysms}}
      - ALIYUN_SMS_ACCESS_KEY_ID=${ALIYUN_SMS_ACCESS_KEY_ID:-${ALIBABA_SMS_ACCESS_KEY_ID:-}}
      - ALIYUN_SMS_ACCESS_KEY_SECRET=${ALIYUN_SMS_ACCESS_KEY_SECRET:-${ALIBABA_SMS_ACCESS_KEY_SECRET:-}}
      - ALIYUN_SMS_ENDPOINT=${ALIYUN_SMS_ENDPOINT:-${ALIBABA_SMS_ENDPOINT:-dysmsapi.aliyuncs.com}}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-${ALIBABA_SMS_SIGN_NAME:-}}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-${ALIBABA_SMS_TEMPLATE_CODE:-}}
      - ALIYUN_SMS_SCHEME_NAME=${ALIYUN_SMS_SCHEME_NAME:-${ALIBABA_SMS_SCHEME_NAME:-}}
      - ALIYUN_SMS_SCHEME_CODE=${ALIYUN_SMS_SCHEME_CODE:-${ALIBABA_SMS_SCHEME_CODE:-}}
      - SMS_RATE_LIMIT_ENABLED=${SMS_RATE_LIMIT_ENABLED:-true}
      - SMS_RATE_LIMIT_HOURLY_LIMIT=${SMS_RATE_LIMIT_HOURLY_LIMIT:-5}
      - SMS_RATE_LIMIT_DAILY_LIMIT=${SMS_RATE_LIMIT_DAILY_LIMIT:-20}
      - SMS_RATE_LIMIT_TIMEZONE=${SMS_RATE_LIMIT_TIMEZONE:-Asia/Shanghai}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-127.0.0.0/8, 172.16.0.0/12, ::1/128}
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: medical-system-db
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=medical_db
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: medical-system-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=miniopassword
      - MINIO_SERVER_URL=http://${EXTERNAL_IP:-www.xiangxiaoya.com}
      - MINIO_BROWSER_REDIRECT_URL=http://${EXTERNAL_IP:-47.117.156.53}:9001
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    volumes:
      - minio-data:/data
    networks:
      - app-network

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: medical-system-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin miniopassword; do
        echo 'Waiting for MinIO...'
        sleep 2
      done;
      /usr/bin/mc mb --ignore-existing myminio/medical-attachments;
      /usr/bin/mc mb --ignore-existing myminio/medical-avatars;
      /usr/bin/mc anonymous set download myminio/medical-avatars;
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  minio-data:
