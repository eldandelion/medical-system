version: '3.8'

services:
  frontend:
    image: ghcr.io/eldandelion/medical-system-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-system-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - app-network

  backend:
    image: ghcr.io/eldandelion/medical-system-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-system-backend
    expose:
      - "8080"
    restart: unless-stopped
    depends_on:
      - db
      - minio
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/medical_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - STORAGE_S3_ENDPOINT_INTERNAL=http://minio:9000
      - STORAGE_S3_ENDPOINT_EXTERNAL=http://${EXTERNAL_IP:-47.117.156.53}:9000
      - STORAGE_S3_ACCESS_KEY=minioadmin
      - STORAGE_S3_SECRET_KEY=miniopassword
      - STORAGE_S3_BUCKET=medical-attachments
      - STORAGE_S3_REGION=us-east-1
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: medical-system-db
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=medical_db
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: medical-system-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=miniopassword
      - MINIO_SERVER_URL=http://${EXTERNAL_IP:-47.117.156.53}:9000
      - MINIO_BROWSER_REDIRECT_URL=http://${EXTERNAL_IP:-47.117.156.53}:9001
    volumes:
      - minio-data:/data
    networks:
      - app-network

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: medical-system-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin miniopassword; do
        echo 'Waiting for MinIO...'
        sleep 2
      done;
      /usr/bin/mc mb --ignore-existing myminio/medical-attachments;
      /usr/bin/mc mb --ignore-existing myminio/medical-avatars;
      /usr/bin/mc anonymous set download myminio/medical-avatars;
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  minio-data:
