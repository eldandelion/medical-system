name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Verify Production Build
        run: npm run build

      - name: Advisory Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  test-mobile:
    name: Mobile Intake Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Verify Production Build
        run: npm run build

      - name: Advisory Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  test-backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit & Integration Tests
        run: ./mvnw test

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  build-images:
    name: Build & Push (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-frontend, test-mobile, test-backend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, mobile]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/medical-system-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/medical-system-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy Stack to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-images]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Compose to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/medical-system"

      - name: Deploy Containers on Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: IMAGE_TAG
          script: |
            set -eu
            cd ~/medical-system
            for attempt in 1 2 3; do
              if IMAGE_TAG="$IMAGE_TAG" docker compose pull backend frontend mobile; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "docker compose pull failed after 3 attempts for tag $IMAGE_TAG" >&2
                exit 1
              fi
              sleep 5
            done
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --remove-orphans
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-deps --wait --wait-timeout 120 backend frontend mobile
            if [ -f .env ]; then
              tmp_env=$(mktemp)
              grep -v '^IMAGE_TAG=' .env > "$tmp_env" || true
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$tmp_env"
              mv "$tmp_env" .env
            fi
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000)" = "200"
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3005)" = "200"
            api_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me)
            echo "Post-deploy check: api_http=$api_code tag=$IMAGE_TAG"
            echo "$api_code" | grep -qE '^(200|401|403)$'
            docker image prune -f --filter "until=24h"
